<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Library Gallery | AK University</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery-header { padding: 80px 0 40px; text-align: center; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .gallery-item { border-radius: 16px; overflow: hidden; height: 350px; box-shadow: var(--sh); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .gallery-item:hover img { transform: scale(1.1); }
    </style>
</head>
<body class="bg-l">

    <!-- Simple Nav -->
    <nav class="navbar">
        <div class="container flex jcb aic" style="padding: 10px 0;">
            <h2 style="color: white; margin:0; font-size: 1.5rem;">AK UNIVERSITY</h2>
            <a href="index.html#facilities" class="btn orange-btn">← Back to Campus</a>
        </div>
    </nav>

    <div class="container gallery-header">
        <h4 class="sub-title">GALLERY</h4>
        <h2 class="section-title" style="font-size: 3rem;">Central Library<span class="dot purple-dot">.</span></h2>
        <p class="section-desc">Get a glimpse of our massive collection of books, quiet reading zones, and digital learning pods.</p>
    </div>

    <div class="container pb-40" style="margin-bottom: 60px;">
        <div class="gallery-grid">
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1541963463532-d68292c34b19?w=800" alt="Library Setup"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1568667256549-094345857637?w=800" alt="Library Books"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=800" alt="Reading Desk"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1510511459019-5efa1254de8d?w=800" alt="Bookshelf"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1565843708714-52ecf69ab81f?w=800" alt="Study Pods"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1491841550275-ad7854e35ca6?w=800" alt="Digital Learning Area"></div>
        </div>
    </div>

</body>
</html>
