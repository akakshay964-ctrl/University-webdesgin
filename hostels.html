<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Hostels Gallery | AK University</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery-header { padding: 80px 0 40px; text-align: center; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .gallery-item { border-radius: 16px; overflow: hidden; height: 350px; box-shadow: var(--sh); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .gallery-item:hover img { transform: scale(1.1); }
    </style>
</head>
<body class="bg-l">

    <!-- Simple Nav -->
    <nav class="navbar">
        <div class="container flex jcb aic" style="padding: 10px 0;">
            <h2 style="color: white; margin:0; font-size: 1.5rem;">AK UNIVERSITY</h2>
            <a href="index.html#facilities" class="btn orange-btn">← Back to Campus</a>
        </div>
    </nav>

    <div class="container gallery-header">
        <h4 class="sub-title">GALLERY</h4>
        <h2 class="section-title" style="font-size: 3rem;">Modern Hostels<span class="dot purple-dot">.</span></h2>
        <p class="section-desc">Experience our comfortable living quarters, complete with spacious rooms, common areas, and high-quality dining facilities.</p>
    </div>

    <div class="container pb-40" style="margin-bottom: 60px;">
        <div class="gallery-grid">
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1555854877-bab0e564b8d5?w=800" alt="Hostel Room"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1522771730849-f59992fec238?w=800" alt="Lounge Area"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?w=800" alt="Shared Bedroom"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1590381105924-c72589b9ef3f?w=800" alt="Dining Hall"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=800" alt="Cafeteria/Mess"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1520699049698-acd2fce18bf4?w=800" alt="Recreation Room"></div>
        </div>
    </div>

</body>
</html>
