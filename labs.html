<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Labs Gallery | AK University</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery-header { padding: 80px 0 40px; text-align: center; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .gallery-item { border-radius: 16px; overflow: hidden; height: 350px; box-shadow: var(--sh); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .gallery-item:hover img { transform: scale(1.1); }
    </style>
</head>
<body class="bg-l">

    <!-- Simple Nav -->
    <nav class="navbar">
        <div class="container flex jcb aic" style="padding: 10px 0;">
            <h2 style="color: white; margin:0; font-size: 1.5rem;">AK UNIVERSITY</h2>
            <a href="index.html#facilities" class="btn orange-btn">← Back to Campus</a>
        </div>
    </nav>

    <div class="container gallery-header">
        <h4 class="sub-title">GALLERY</h4>
        <h2 class="section-title" style="font-size: 3rem;">Advanced Labs<span class="dot purple-dot">.</span></h2>
        <p class="section-desc">Experience our high-tech laboratories designed for robotics, artificial intelligence, and applied sciences.</p>
    </div>

    <div class="container pb-40" style="margin-bottom: 60px;">
        <div class="gallery-grid">
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=800" alt="Tech Lab"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=800" alt="Robotics"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=800" alt="Chemistry Lab"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1574170623305-6af24bbd18bc?w=800" alt="Computer Hardware"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1614935151651-0bea6508ab6b?w=800" alt="Microscopes"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=800" alt="AI Research"></div>
        </div>
    </div>

</body>
</html>
