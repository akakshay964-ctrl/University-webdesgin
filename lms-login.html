<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK LMS Login | AK University</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1513258496099-481620202271?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .login-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(39, 174, 96, 0.85), rgba(0, 29, 61, 0.95));
            z-index: 1;
        }
        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 450px;
            background: var(--w);
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header {
            background: var(--g);
            padding: 40px 30px;
            text-align: center;
            color: var(--w);
            position: relative;
        }
        .login-header h2 {
            color: var(--w);
            font-size: 2rem;
            margin-bottom: 5px;
        }
        .login-header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }
        .login-body {
            padding: 40px 30px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--d);
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: var(--t);
            background: var(--bg);
            transition: 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--g);
            background: var(--w);
            box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.15);
        }
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--tm);
        }
        .forgot-password {
            color: var(--g);
            font-weight: 600;
        }
        .forgot-password:hover {
            color: var(--p);
            text-decoration: underline;
        }
        .login-btn-wrapper {
            margin-bottom: 25px;
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            background: var(--g);
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-btn:hover {
            background: #219653;
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.5);
            transform: translateY(-3px);
        }
        .back-home {
            display: block;
            text-align: center;
            color: var(--tm);
            font-size: 0.95rem;
            font-weight: 500;
            transition: 0.3s;
            text-decoration: none;
        }
        .back-home:hover {
            color: var(--g);
            transform: translateX(-5px);
        }
    </style>
</head>
<body>

    <div class="login-overlay"></div>

    <div class="login-container">
        <div class="login-header">
            <h2>AK LMS<span class="dot text-white">.</span></h2>
            <p>Learning Management System</p>
        </div>
        <div class="login-body">
            <form id="lmsLoginForm">
                <div class="form-group">
                    <label>Student / Faculty ID</label>
                    <input type="text" placeholder="Enter your ID" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                
                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Need Help?</a>
                </div>

                <div class="login-btn-wrapper">
                    <button type="submit" class="login-btn">Access Courses</button>
                </div>
                
                <a href="index.html" class="back-home">← Return to Homepage</a>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('lmsLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Just a demo alert for the form
            let btn = this.querySelector('.login-btn');
            btn.innerHTML = 'Connecting...';
            btn.style.opacity = '0.7';
            setTimeout(() => {
                alert("Login successful! Redirecting to LMS Dashboard...");
                btn.innerHTML = 'Access Courses';
                btn.style.opacity = '1';
                // In a real app, redirection code goes here
                window.location.href = 'index.html';
            }, 1000);
        });
    </script>
</body>
</html>
