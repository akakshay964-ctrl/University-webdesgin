<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Exam Registration | AK University</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1546410531-bea5aadcb6ce?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px 20px;
        }
        .scholarship-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(88, 28, 135, 0.9), rgba(0, 29, 61, 0.95)); /* Purple to Dark Blue */
            z-index: 1;
        }
        .scholarship-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 600px;
            background: var(--w);
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .scholarship-header {
            background: linear-gradient(90deg, var(--p), #7e22ce);
            padding: 40px 30px;
            text-align: center;
            color: var(--w);
            position: relative;
        }
        .scholarship-header h2 {
            color: var(--w);
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .scholarship-header p {
            font-size: 1rem;
            opacity: 0.9;
        }
        .scholarship-body {
            padding: 40px 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--d);
            font-size: 0.9rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: var(--t);
            background: var(--bg);
            transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--p);
            background: var(--w);
            box-shadow: 0 0 0 3px rgba(88, 28, 135, 0.15);
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .submit-btn-wrapper {
            margin-top: 30px;
            margin-bottom: 25px;
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            background: linear-gradient(90deg, var(--s), #f97316);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(230, 138, 0, 0.3);
        }
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(230, 138, 0, 0.5);
        }
        .back-home {
            display: block;
            text-align: center;
            color: var(--tm);
            font-size: 0.95rem;
            font-weight: 500;
            transition: 0.3s;
            text-decoration: none;
        }
        .back-home:hover {
            color: var(--p);
            transform: translateX(-5px);
        }
    </style>
</head>
<body>

    <div class="scholarship-overlay"></div>

    <div class="scholarship-container">
        <div class="scholarship-header">
            <h2>AKU Scholarship Test 2026<span class="dot orange-dot">.</span></h2>
            <p>Register for the National Level Entrance & Scholarship Examination to secure up to 100% financial aid.</p>
        </div>
        <div class="scholarship-body">
            <form id="scholarshipForm">
                <div class="form-group">
                    <label>Full Name (As per 10th Certificate)</label>
                    <input type="text" placeholder="Enter your full name" required>
                </div>
                
                <div class="grid-2">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Mobile Number</label>
                        <input type="tel" placeholder="+91" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" required>
                    </div>
                    <div class="form-group">
                        <label>Current Status</label>
                        <select required>
                            <option value="" disabled selected>Select</option>
                            <option value="12th_pursuing">12th Pursuing</option>
                            <option value="12th_passed">12th Passed</option>
                            <option value="ug_pursuing">UG Pursuing</option>
                            <option value="ug_passed">UG Passed</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Preferred Course for Admission</label>
                    <select required>
                        <option value="" disabled selected>Select Course</option>
                        <option value="btech">B.Tech</option>
                        <option value="mba">MBA</option>
                        <option value="mca">MCA</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Preferred Exam Center</label>
                    <select required>
                        <option value="" disabled selected>Select City</option>
                        <option value="delhi">New Delhi</option>
                        <option value="mumbai">Mumbai</option>
                        <option value="bangalore">Bangalore</option>
                        <option value="hyderabad">Hyderabad</option>
                        <option value="online">Online (Home Proctored)</option>
                    </select>
                </div>

                <div class="submit-btn-wrapper">
                    <button type="submit" class="submit-btn">Register for Scholarship Test</button>
                </div>
                
                <a href="index.html" class="back-home">← Return to Homepage</a>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('scholarshipForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let btn = this.querySelector('.submit-btn');
            btn.innerHTML = 'Processing Registration...';
            btn.style.opacity = '0.7';
            setTimeout(() => {
                alert("Registration Successful! Your Mock Test Links and Admit Card details will be sent to your email shortly.");
                btn.innerHTML = 'Register for Scholarship Test';
                btn.style.opacity = '1';
                this.reset();
            }, 1500);
        });
    </script>
</body>
</html>
