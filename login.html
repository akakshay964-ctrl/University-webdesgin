<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK ERP Login | AK University</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .login-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(0, 29, 61, 0.9), rgba(93, 16, 73, 0.9));
            z-index: 1;
        }
        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 450px;
            background: var(--w);
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header {
            background: var(--p);
            padding: 40px 30px;
            text-align: center;
            color: var(--w);
            position: relative;
        }
        .login-header h2 {
            color: var(--w);
            font-size: 2rem;
            margin-bottom: 5px;
        }
        .login-header p {
            font-size: 0.95rem;
            opacity: 0.8;
        }
        .login-body {
            padding: 40px 30px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--d);
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: var(--t);
            background: var(--bg);
            transition: 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--s);
            background: var(--w);
            box-shadow: 0 0 0 3px rgba(230, 138, 0, 0.1);
        }
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--tm);
        }
        .forgot-password {
            color: var(--p);
            font-weight: 600;
        }
        .forgot-password:hover {
            color: var(--s);
            text-decoration: underline;
        }
        .login-btn-wrapper {
            margin-bottom: 25px;
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
        }
        .back-home {
            display: block;
            text-align: center;
            color: var(--tm);
            font-size: 0.95rem;
            font-weight: 500;
            transition: 0.3s;
        }
        .back-home:hover {
            color: var(--p);
            transform: translateX(-5px);
        }
        .tab-btns {
            display: flex;
            margin-top: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--w);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: rgba(255,255,255,0.3);
            border-bottom: 3px solid var(--s);
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
        .error-msg {
            color: red;
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-overlay"></div>

    <div class="login-container">
        <div class="login-header">
            <h2>AK ERP</h2>
            <p>Student & Staff Portal</p>
            <div class="tab-btns">
                <button type="button" class="tab-btn active" onclick="switchForm('login')">Sign In</button>
                <button type="button" class="tab-btn" onclick="switchForm('register')">Sign Up</button>
            </div>
        </div>
        <div class="login-body">
            <!-- LOGIN FORM -->
            <form id="erpLoginForm" class="form-section active">
                <div id="loginError" class="error-msg"></div>
                <div class="form-group">
                    <label>University ID / Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter your ID" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                
                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <div class="login-btn-wrapper">
                    <button type="submit" class="btn orange-btn login-btn">Sign In to ERP</button>
                </div>
                
                <a href="index.html" class="back-home">← Return to Homepage</a>
            </form>

            <!-- REGISTER FORM -->
            <form id="erpRegisterForm" class="form-section">
                <div id="regError" class="error-msg"></div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>University ID / Username</label>
                    <input type="text" id="regUsername" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="••••••••" required>
                </div>

                <div class="login-btn-wrapper">
                    <button type="submit" class="btn orange-btn login-btn" style="background: var(--p);">Create Account</button>
                </div>
                
                <a href="index.html" class="back-home">← Return to Homepage</a>
            </form>
        </div>
    </div>

    <script>
        function switchForm(formName) {
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            if(formName === 'login') {
                document.getElementById('erpLoginForm').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('erpRegisterForm').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }
        }

        // Auto-initialize users array if not present
        if(!localStorage.getItem('ak_users')) {
            localStorage.setItem('ak_users', JSON.stringify([]));
        }

        // Register
        document.getElementById('erpRegisterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let name = document.getElementById('regName').value.trim();
            let username = document.getElementById('regUsername').value.trim();
            let password = document.getElementById('regPassword').value;
            let errorDiv = document.getElementById('regError');

            let users = JSON.parse(localStorage.getItem('ak_users'));
            if(users.some(u => u.username === username)) {
                errorDiv.innerText = "Username already exists!";
                errorDiv.style.display = "block";
                return;
            }

            users.push({ name, username, password });
            localStorage.setItem('ak_users', JSON.stringify(users));
            
            alert("Account created successfully! Please sign in.");
            this.reset();
            errorDiv.style.display = "none";
            switchForm('login');
        });

        // Login
        document.getElementById('erpLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let username = document.getElementById('loginUsername').value.trim();
            let password = document.getElementById('loginPassword').value;
            let errorDiv = document.getElementById('loginError');

            let btn = this.querySelector('.login-btn');
            btn.innerHTML = 'Authenticating...';
            btn.style.opacity = '0.7';

            setTimeout(() => {
                let users = JSON.parse(localStorage.getItem('ak_users'));
                let user = users.find(u => u.username === username && u.password === password);

                if(user) {
                    errorDiv.style.display = "none";
                    localStorage.setItem('ak_current_user', JSON.stringify(user));
                    alert("Login successful! Redirecting...");
                    window.location.href = 'index.html';
                } else {
                    errorDiv.innerText = "Invalid username or password!";
                    errorDiv.style.display = "block";
                    btn.innerHTML = 'Sign In to ERP';
                    btn.style.opacity = '1';
                }
            }, 800);
        });
    </script>
</body>
</html>
