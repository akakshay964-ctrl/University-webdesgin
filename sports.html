<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Complex Gallery | AK University</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery-header { padding: 80px 0 40px; text-align: center; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .gallery-item { border-radius: 16px; overflow: hidden; height: 350px; box-shadow: var(--sh); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .gallery-item:hover img { transform: scale(1.1); }
    </style>
</head>
<body class="bg-l">

    <!-- Simple Nav -->
    <nav class="navbar">
        <div class="container flex jcb aic" style="padding: 10px 0;">
            <h2 style="color: white; margin:0; font-size: 1.5rem;">AK UNIVERSITY</h2>
            <a href="index.html#facilities" class="btn orange-btn">← Back to Campus</a>
        </div>
    </nav>

    <div class="container gallery-header">
        <h4 class="sub-title">GALLERY</h4>
        <h2 class="section-title" style="font-size: 3rem;">Sports Complex<span class="dot purple-dot">.</span></h2>
        <p class="section-desc">Take a look at our Olympic standard swimming pools, massive tracks, courts, and fitness centers.</p>
    </div>

    <div class="container pb-40" style="margin-bottom: 60px;">
        <div class="gallery-grid">
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=800" alt="Gym"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?w=800" alt="Running Track"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1575424909138-46b05e5919ec?w=800" alt="Swimming Pool"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1502014822147-1aedfb0676e0?w=800" alt="Basketball Court"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=800" alt="Stadium"></div>
            <div class="gallery-item"><img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=800" alt="Tennis Court"></div>
        </div>
    </div>

</body>
</html>
